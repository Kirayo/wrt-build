# ==============================================================================
# OpenWrt Feed 插件覆盖配置文件
# 默认路径: ${CORE_PATH}/feeds/overrides.conf
# 语法格式: <Feed名称> | <插件包名称>
# ==============================================================================

# 1. 强制使用 kenzo 源的应用程序
kenzo | luci-app-adguardhome

# 2. 强制使用官方 packages 源的语言环境（防止被第三方库中的旧版本覆盖）
packages | golang
packages | node

# 3. 强制使用自定义源中的主题
# myfeed | luci-theme-argon

